<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon École — GS · CP · CM1 · CM2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fef9f4;--surface:#fff;--surface2:#faf6f1;--border:#ede5d8;
  --text:#1e1812;--text2:#7a6f68;--text3:#b8a89a;
  --gs:#e91e8c;--cp:#f59e0b;--cm1:#e07b39;--cm2:#3b82f6;
  --ma:#8b5cf6;--fr-s:#ef4444;--ev:#10b981;
  --hi:#dc2626;--ge:#059669;--frcm:#7c3aed;
  --green:#16a34a;--green-l:#dcfce7;
  --red:#dc2626;--red-l:#fee2e2;
  --r:16px;--rs:10px;
  --sh:0 2px 16px rgba(0,0,0,.06);--shl:0 8px 40px rgba(0,0,0,.12)
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:2px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--sh)}
.logo{font-family:'Fredoka One',cursive;font-size:1.4rem}
.logo .gs{color:var(--gs)}.logo .cp{color:var(--cp)}.logo .cm1c{color:var(--cm1)}.logo .cm2c{color:var(--cm2)}
.logo .sep{color:var(--text3);font-size:.85rem;margin:0 3px}
.score-bar{display:flex;gap:6px}
.sp{display:flex;align-items:center;gap:4px;padding:4px 11px;border-radius:50px;font-size:13px;font-weight:800;border:1.5px solid var(--border);background:var(--surface2)}
.sp.ok{border-color:var(--green);color:var(--green);background:var(--green-l)}
.sp.ko{border-color:var(--red);color:var(--red);background:var(--red-l)}
.main{max-width:700px;margin:0 auto;padding:1.5rem 1.25rem}
.home-hero{text-align:center;padding:1.25rem 0 .5rem}
.home-hero h1{font-family:'Fredoka One',cursive;font-size:2rem;margin-bottom:.3rem}
.home-hero p{color:var(--text2);font-size:.95rem}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.25rem}
.lcard{border:2.5px solid var(--border);border-radius:var(--r);padding:1.25rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center;position:relative;overflow:hidden}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:5px}
.lcard.gs{border-color:var(--gs);background:#fde8f4}.lcard.gs::before{background:var(--gs)}
.lcard.cp{border-color:var(--cp);background:#fef3c7}.lcard.cp::before{background:var(--cp)}
.lcard.cm1{border-color:var(--cm1);background:#fdf0e6}.lcard.cm1::before{background:var(--cm1)}
.lcard.cm2{border-color:var(--cm2);background:#eff6ff}.lcard.cm2::before{background:var(--cm2)}
.lcard:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.lcard-lbl{font-family:'Fredoka One',cursive;font-size:2rem}
.lcard.gs .lcard-lbl{color:var(--gs)}.lcard.cp .lcard-lbl{color:var(--cp)}
.lcard.cm1 .lcard-lbl{color:var(--cm1)}.lcard.cm2 .lcard-lbl{color:var(--cm2)}
.lcard-sub{font-size:11px;color:var(--text2);margin-top:3px;font-weight:700}
.vocal-tag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:50px;background:var(--green-l);color:var(--green);border:1px solid var(--green)}
.subj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem}
.scard{border:2px solid var(--border);border-radius:var(--r);padding:1.1rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shl)}
.scard-icon{font-size:2rem;margin-bottom:5px}
.scard-lbl{font-family:'Fredoka One',cursive;font-size:1.1rem}
.scard-desc{font-size:11px;color:var(--text2);margin-top:2px;font-weight:600}
.scard.ma{border-color:var(--ma)}.scard.ma .scard-lbl{color:var(--ma)}
.scard.fr{border-color:var(--fr-s)}.scard.fr .scard-lbl{color:var(--fr-s)}
.scard.ev{border-color:var(--ev)}.scard.ev .scard-lbl{color:var(--ev)}
.scard.hi{border-color:var(--hi)}.scard.hi .scard-lbl{color:var(--hi)}
.scard.ge{border-color:var(--ge)}.scard.ge .scard-lbl{color:var(--ge)}
.scard.frcm{border-color:var(--frcm)}.scard.frcm .scard-lbl{color:var(--frcm)}
.settings-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--sh)}
.settings-card h3{font-family:'Fredoka One',cursive;font-size:1rem;margin-bottom:.8rem}
.diff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.5rem}
.diff-btn{padding:11px 8px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surface2);cursor:pointer;text-align:center;transition:all .18s;font-family:'Nunito',sans-serif}
.diff-btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.diff-icon{font-size:1.3rem;margin-bottom:3px}
.diff-name{font-size:13px;font-weight:800}
.diff-desc{font-size:10px;color:var(--text2);margin-top:1px}
.diff-btn.sel-easy{background:#dcfce7;border-color:#16a34a;color:#16a34a}
.diff-btn.sel-medium{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.diff-btn.sel-hard{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.diff-btn.sel-vhard{background:#f5f3ff;border-color:#7c3aed;color:#7c3aed}
.start-btn{width:100%;padding:13px;font-family:'Fredoka One',cursive;font-size:1.1rem;border:none;border-radius:var(--rs);cursor:pointer;color:#fff;transition:all .2s;margin-top:.5rem}
.start-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.qcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:1.35rem;box-shadow:var(--sh);animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.qnum{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.qprogress{flex:1;height:6px;background:var(--border);border-radius:6px;overflow:hidden}
.qbar{height:100%;border-radius:6px;transition:width .4s}
.diff-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:50px;white-space:nowrap}
.sound-btn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;margin-bottom:1rem;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;border:2px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text);cursor:pointer;text-align:left;line-height:1.45}
.sound-btn:hover{background:var(--surface);box-shadow:var(--sh)}
.qemoji{font-size:2.8rem;text-align:center;margin-bottom:.5rem;line-height:1}
.qtext{font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:1rem;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1rem}
.cbtn{padding:13px 10px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;border:2px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .18s;text-align:center;line-height:1.3}
.cbtn:hover:not(:disabled){border-color:var(--text2);background:var(--surface);transform:translateY(-1px);box-shadow:var(--sh)}
.cbtn:disabled{cursor:default}
.cbtn.correct{background:var(--green-l);border-color:var(--green);color:var(--green)}
.cbtn.wrong{background:var(--red-l);border-color:var(--red);color:var(--red);text-decoration:line-through}
.cbtn.reveal{background:var(--green-l);border-color:var(--green);color:var(--green);opacity:.55}
.choices.big .cbtn{padding:15px 10px;font-size:1rem;display:flex;align-items:center;justify-content:space-between;gap:6px}
.choices.big .cbtn .ct{flex:1;text-align:center}
.choices.big .cbtn .sv{opacity:.4;font-size:.95rem}
.feedback{border-radius:var(--rs);padding:11px 14px;font-size:14px;font-weight:700;margin-bottom:.9rem;display:none;line-height:1.5}
.feedback.ok{display:block;background:var(--green-l);color:var(--green);border:1.5px solid var(--green)}
.feedback.ko{display:block;background:var(--red-l);color:var(--red);border:1.5px solid var(--red)}
.navrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 18px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;border-radius:50px;border:2px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .18s}
.btn:hover{border-color:var(--text2);color:var(--text)}
.btn.primary{color:#fff;border:none;padding:10px 22px}
.btn.primary:hover{filter:brightness(1.08)}
.rcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:2.25rem 1.5rem;text-align:center;box-shadow:var(--shl);animation:fadeUp .3s ease}
.remoji{font-size:3.5rem;margin-bottom:.5rem}
.rscore{font-family:'Fredoka One',cursive;font-size:2.8rem}
.rpct{font-size:13px;color:var(--text3);margin:4px 0 6px;font-weight:700}
.rmsg{font-size:1rem;font-weight:700;color:var(--text2);margin-bottom:1.5rem}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:1rem}
.bc-i{font-size:13px;font-weight:700;color:var(--text3);cursor:pointer}.bc-i:hover{color:var(--text)}
.bc-s{font-size:13px;color:var(--text3)}.bc-c{font-size:13px;font-weight:700;color:var(--text)}
@media(max-width:500px){
  .choices,.level-grid,.diff-grid{grid-template-columns:1fr}
  .subj-grid{grid-template-columns:1fr 1fr}
  .main{padding:1rem}
  .qtext{font-size:1rem}
  .logo{font-size:1.15rem}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <span class="gs">GS</span><span class="sep">·</span>
    <span class="cp">CP</span><span class="sep">·</span>
    <span class="cm1c">CM1</span><span class="sep">·</span>
    <span class="cm2c">CM2</span>
  </div>
  <div class="score-bar">
    <div class="sp ok">✓ <span id="score-ok">0</span></div>
    <div class="sp ko">✗ <span id="score-ko">0</span></div>
  </div>
</header>
<div class="main" id="main"></div>

<script>
// ════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

function makeChoices(correct, generator, count = 4) {
  const choices = new Set([String(correct)]);
  let attempts = 0;
  while (choices.size < count && attempts < 100) {
    const c = generator();
    if (c !== correct && c >= 0) choices.add(String(c));
    attempts++;
  }
  while (choices.size < count) {
    choices.add(String(correct + choices.size + rnd(1,5)));
  }
  const arr = shuffle([...choices]);
  return { ch: arr, a: arr.indexOf(String(correct)) };
}

// ════════════════════════════════════════════════════════
//  SYNTHÈSE VOCALE
// ════════════════════════════════════════════════════════
function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const clean=String(text).replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/[→•]/g,'').trim();
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='fr-FR';u.rate=0.85;u.pitch=1.1;
  window.speechSynthesis.speak(u);
}
function stopSpeech(){if(window.speechSynthesis)window.speechSynthesis.cancel()}

// ════════════════════════════════════════════════════════
//  GÉNÉRATEURS DE QUESTIONS DYNAMIQUES POUR LES MATHS
// ════════════════════════════════════════════════════════
const MATH_GEN = {
  gs: {
    compter: {
      easy: () => {
        const n = rnd(1, 3);
        const e = '⭐'.repeat(n);
        return { q: "Combien d'étoiles ?", e, ...makeChoices(n, () => rnd(1, 5)), ex: `Compte : ${n} étoile${n>1?'s':''}.` };
      },
      medium: () => {
        const n = rnd(4, 6);
        const emojis = ['🍎','🐱','🎈','⭐','🌸','🦆'];
        const em = pick(emojis);
        return { q: `Combien de ${em} ?`, e: em.repeat(n), ...makeChoices(n, () => rnd(3, 8)), ex: `Compte : ${n}.` };
      },
      hard: () => {
        const n = rnd(7, 10);
        const emojis = ['🐱','⭐','🍎','🎈'];
        const em = pick(emojis);
        return { q: `Combien de ${em} ?`, e: em.repeat(n), ...makeChoices(n, () => rnd(5, 12)), ex: `Compte : ${n}.` };
      },
      vhard: () => {
        const type = rnd(0, 2);
        if (type === 0) {
          const n = rnd(11, 15);
          return { q: `Combien de cœurs ?`, e: '❤️'.repeat(n), ...makeChoices(n, () => rnd(8, 18)), ex: `${n} cœurs.` };
        }
        if (type === 1) {
          const n = rnd(5, 10);
          return { q: `Quel nombre vient après ${n} ?`, ...makeChoices(n+1, () => rnd(Math.max(0,n-2), n+3)), ex: `Après ${n} vient ${n+1}.` };
        }
        const n = rnd(3, 9);
        return { q: `Quel nombre vient avant ${n} ?`, ...makeChoices(n-1, () => rnd(Math.max(0,n-3), n+2)), ex: `Avant ${n} : ${n-1}.` };
      },
    },
    additions: {
      easy: () => {
        const a = rnd(1, 2), b = rnd(1, 2);
        return { q: `Combien font ${a} + ${b} ?`, e: '🍎'.repeat(a)+' + '+'🍎'.repeat(b), ...makeChoices(a+b, () => rnd(1, 6)), ex: `${a} + ${b} = ${a+b}.` };
      },
      medium: () => {
        const a = rnd(1, 4), b = rnd(1, 4);
        return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(2, 10)), ex: `${a} + ${b} = ${a+b}.` };
      },
      hard: () => {
        const a = rnd(2, 6), b = rnd(2, 5);
        return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(4, 12)), ex: `${a} + ${b} = ${a+b}.` };
      },
      vhard: () => {
        const type = rnd(0, 1);
        if (type === 0) {
          const a = rnd(4, 7), b = rnd(3, 6);
          return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(6, 15)), ex: `${a} + ${b} = ${a+b}.` };
        }
        const a = rnd(2, 4), b = rnd(2, 4), c = rnd(1, 3);
        return { q: `Combien font ${a} + ${b} + ${c} ?`, ...makeChoices(a+b+c, () => rnd(4, 12)), ex: `${a}+${b}+${c} = ${a+b+c}.` };
      },
    },
  },
  cp: {
    nombres: {
      easy: () => {
        const t = rnd(0, 1);
        if (t === 0) {
          const a = rnd(1, 5), b = rnd(1, 4);
          return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(1, 12)), ex: `${a}+${b}=${a+b}.` };
        }
        const n = rnd(2, 8);
        return { q: `Quel nombre vient après ${n} ?`, ...makeChoices(n+1, () => rnd(Math.max(0,n-2), n+4)), ex: `${n}, ${n+1}.` };
      },
      medium: () => {
        const t = rnd(0, 2);
        if (t === 0) {
          const a = rnd(3, 7), b = rnd(2, 6);
          return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(4, 16)), ex: `${a}+${b}=${a+b}.` };
        }
        if (t === 1) {
          const a = rnd(5, 10), b = rnd(1, Math.min(4, a));
          return { q: `Combien font ${a} - ${b} ?`, ...makeChoices(a-b, () => rnd(0, 10)), ex: `${a}-${b}=${a-b}.` };
        }
        let a = rnd(2, 15), b = rnd(2, 15);
        while (b === a) b = rnd(2, 15);
        const big = Math.max(a, b);
        const arr = shuffle([String(a), String(b), 'Égaux', 'Aucun']);
        return { q: `Quel est le plus grand : ${a} ou ${b} ?`, ch: arr, a: arr.indexOf(String(big)), ex: `${big} > ${Math.min(a,b)}.` };
      },
      hard: () => {
        const t = rnd(0, 2);
        if (t === 0) {
          const a = rnd(7, 12), b = rnd(5, 9);
          return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(10, 25)), ex: `${a}+${b}=${a+b}.` };
        }
        if (t === 1) {
          const a = rnd(10, 18), b = rnd(3, 8);
          return { q: `Combien font ${a} - ${b} ?`, ...makeChoices(a-b, () => rnd(0, 15)), ex: `${a}-${b}=${a-b}.` };
        }
        const a = rnd(4, 10);
        return { q: `Quel est le double de ${a} ?`, ...makeChoices(a*2, () => rnd(5, 25)), ex: `${a}+${a}=${a*2}.` };
      },
      vhard: () => {
        const t = rnd(0, 2);
        if (t === 0) {
          const a = rnd(15, 30), b = rnd(5, 15);
          return { q: `Combien font ${a} + ${b} ?`, ...makeChoices(a+b, () => rnd(20, 50)), ex: `${a}+${b}=${a+b}.` };
        }
        if (t === 1) {
          const a = rnd(20, 40), b = rnd(5, 15);
          return { q: `Combien font ${a} - ${b} ?`, ...makeChoices(a-b, () => rnd(5, 35)), ex: `${a}-${b}=${a-b}.` };
        }
        const a = rnd(2, 10);
        return { q: `Quelle est la moitié de ${a*2} ?`, ...makeChoices(a, () => rnd(1, 12)), ex: `${a*2}÷2=${a}.` };
      },
    },
    calcul: {
      easy: () => {
        const a = rnd(1, 5), b = rnd(1, 4);
        return { q: `${a} + ${b} = ?`, ...makeChoices(a+b, () => rnd(1, 12)), ex: `${a}+${b}=${a+b}.` };
      },
      medium: () => {
        const t = rnd(0, 1);
        if (t === 0) { const a=rnd(3,8),b=rnd(2,7); return { q: `${a} + ${b} = ?`, ...makeChoices(a+b, () => rnd(4, 18)), ex: `=${a+b}.` };}
        const a=rnd(6,12),b=rnd(1,5);
        return { q: `${a} - ${b} = ?`, ...makeChoices(a-b, () => rnd(0, 12)), ex: `=${a-b}.` };
      },
      hard: () => {
        const t = rnd(0, 1);
        if (t === 0) { const a=rnd(8,14),b=rnd(4,9); return { q: `${a} + ${b} = ?`, ...makeChoices(a+b, () => rnd(10, 25)), ex: `=${a+b}.` };}
        const a=rnd(12,20),b=rnd(4,10);
        return { q: `${a} - ${b} = ?`, ...makeChoices(a-b, () => rnd(0, 18)), ex: `=${a-b}.` };
      },
      vhard: () => {
        const t = rnd(0, 1);
        if (t === 0) { const a=rnd(10,25),b=rnd(5,15); return { q: `${a} + ${b} = ?`, ...makeChoices(a+b, () => rnd(15, 45)), ex: `=${a+b}.` };}
        const a=rnd(15,30),b=rnd(5,15);
        return { q: `${a} - ${b} = ?`, ...makeChoices(a-b, () => rnd(0, 30)), ex: `=${a-b}.` };
      },
    },
  },
  cm1: {
    calcul: {
      easy: () => {
        const t = rnd(0, 2);
        if (t === 0) { const a=rnd(20,50),b=rnd(10,30); return { q:`${a} + ${b} = ?`, ...makeChoices(a+b, () => rnd(20, 100)), ex:`=${a+b}.` };}
        if (t === 1) { const a=rnd(40,80),b=rnd(10,30); return { q:`${a} - ${b} = ?`, ...makeChoices(a-b, () => rnd(0, 80)), ex:`=${a-b}.` };}
        const a=rnd(2,9),b=rnd(2,9);
        return { q:`${a} × ${b} = ?`, ...makeChoices(a*b, () => rnd(4, 90)), ex:`=${a*b}.` };
      },
      medium: () => {
        const t = rnd(0, 3);
        if (t === 0) { const a=rnd(100,500),b=rnd(50,300); return { q:`${a} + ${b} = ?`, ...makeChoices(a+b, () => rnd(100,900)), ex:`=${a+b}.` };}

let S = {view:'home',level:null,subject:null,cat:null,difficulty:'easy',questions:[],qIndex:0,answered:false,scoreOk:0,scoreKo:0};
function isVocal(){return S.level && LEVELS[S.level].vocal}

// ════════════════════════════════════════════════════════
//  RÉCUPÉRATION DES QUESTIONS
// ════════════════════════════════════════════════════════
function getQuestions(count = 8) {
  const result = [];
  const gen = MATH_GEN[S.level]?.[S.cat]?.[S.difficulty];

  // Helper pour résoudre _correct vers index a si nécessaire
  const fixA = (q) => {
    if (q && q._correct !== undefined && (q.a === -1 || q.a === undefined)) {
      q.a = q.ch.indexOf(q._correct);
      if (q.a < 0) q.a = 0; // fallback sécurité
    }
    return q;
  };

  // Si on a un générateur dynamique pour ce thème, on l'utilise
  if (gen && typeof gen === 'function') {
    for (let i = 0; i < count; i++) {
      try { result.push(fixA(gen())); } catch(e) { console.error('gen error', e); }
    }
    return result;
  }

  // Sinon on pioche dans la banque statique
  const bank = BANK[S.level]?.[S.subject]?.[S.cat]?.[S.difficulty];
  if (bank && bank.length > 0) {
    const pool = shuffle(bank);
    // Si pas assez de questions distinctes, on complète depuis les autres difficultés
    if (pool.length >= count) return pool.slice(0, count);
    // Compléter avec d'autres difficultés
    const allBank = BANK[S.level]?.[S.subject]?.[S.cat];
    if (allBank) {
      const allQs = [];
      for (const d of ['easy','medium','hard','vhard']) {
        if (allBank[d]) allQs.push(...allBank[d]);
      }
      return shuffle(allQs).slice(0, count);
    }
    return pool;
  }
  return [];
}

// ════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════
function render() {
  stopSpeech();
  document.getElementById('score-ok').textContent = S.scoreOk;
  document.getElementById('score-ko').textContent = S.scoreKo;
  const m = document.getElementById('main');
  if (S.view === 'home') return rHome(m);
  if (S.view === 'subject') return rSubject(m);
  if (S.view === 'settings') return rSettings(m);
  if (S.view === 'result') return rResult(m);
  rQuiz(m);
}

function rHome(m) {
  m.innerHTML = `
    <div class="home-hero"><h1>Mon École 🏫</h1><p>Des milliers d'exercices différents !</p></div>
    <div class="level-grid">
      ${Object.entries(LEVELS).map(([k,v])=>`
        <div class="lcard ${k}" onclick="goLevel('${k}')">
          <div class="lcard-lbl">${v.label}</div>
          <div class="lcard-sub">${Object.keys(v.subjects).length} matières · 4 difficultés</div>
          ${v.vocal?'<div class="vocal-tag">🔊 Lecture vocale</div>':''}
        </div>`).join('')}
    </div>`;
}

function rSubject(m) {
  const lv = LEVELS[S.level];
  m.innerHTML = bc([{l:'Accueil',f:'home()'},{l:lv.label+' — Matière',f:null}])+
    `<div class="subj-grid">${Object.entries(lv.subjects).map(([k,v])=>`
      <div class="scard ${k}" onclick="goSubject('${k}')">
        <div class="scard-icon">${v.icon}</div>
        <div class="scard-lbl">${v.label}</div>
        <div class="scard-desc">${Object.keys(v.cats).length} thème${Object.keys(v.cats).length>1?'s':''}</div>
      </div>`).join('')}</div>`;
}

function rSettings(m) {
  const lv = LEVELS[S.level];
  const sub = lv.subjects[S.subject];
  const hex = LV_COLORS[S.level];
  m.innerHTML = bc([{l:'Accueil',f:'home()'},{l:lv.label,f:`goLevel('${S.level}')`},{l:sub.label+' — Paramètres',f:null}])+
    `<div class="settings-card"><h3>📌 Thème</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${Object.entries(sub.cats).map(([k,v])=>`
        <button onclick="setCat('${k}')" style="padding:7px 14px;border-radius:50px;font-size:12px;font-weight:700;border:2px solid var(--border);background:${S.cat===k?hex+'22':'var(--surface)'};border-color:${S.cat===k?hex:'var(--border)'};color:${S.cat===k?hex:'var(--text2)'};cursor:pointer">${v}</button>
      `).join('')}</div>
    </div>
    <div class="settings-card"><h3>🎯 Niveau de difficulté</h3>
      <div class="diff-grid">${DIFFS.map(d=>`
        <div class="diff-btn ${S.difficulty===d.id?d.sel:''}" onclick="setDiff('${d.id}')">
          <div class="diff-icon">${d.icon}</div>
          <div class="diff-name">${d.label}</div>
          <div class="diff-desc">${d.desc}</div>
        </div>`).join('')}</div>
    </div>
    <button class="start-btn" style="background:${hex}" onclick="startQuiz()">🚀 Lancer les exercices !</button>`;
}

function rQuiz(m) {
  const lv = LEVELS[S.level];
  const sub = lv.subjects[S.subject];
  const q = S.questions[S.qIndex];
  if (!q) {
    m.innerHTML = `<div class="qcard"><div class="qtext">Aucune question disponible pour ce thème/difficulté. Désolé !</div><button class="btn" onclick="home()">← Accueil</button></div>`;
    return;
  }
  const pct = Math.round(S.qIndex/S.questions.length*100);
  const diff = DIFFS.find(d=>d.id===S.difficulty);
  const hex = LV_COLORS[S.level];
  const vocal = lv.vocal;
  const cho = vocal
    ? q.ch.map((c,i)=>`<button class="cbtn" id="ch${i}" onclick="answerV(${i})"><span class="ct">${c}</span><span class="sv">🔊</span></button>`).join('')
    : q.ch.map((c,i)=>`<button class="cbtn" id="ch${i}" onclick="answer(${i})">${c}</button>`).join('');

  m.innerHTML = bc([{l:'Accueil',f:'home()'},{l:lv.label,f:`goLevel('${S.level}')`},{l:sub.label,f:null}])+
    `<div class="qcard">
      <div class="qmeta">
        <div class="qnum">Q ${S.qIndex+1}/${S.questions.length}</div>
        <div class="qprogress"><div class="qbar" style="width:${pct}%;background:${hex}"></div></div>
        <div class="diff-badge" style="background:${diff.id==='easy'?'#dcfce7':diff.id==='medium'?'#fef3c7':diff.id==='hard'?'#fee2e2':'#f5f3ff'};color:${diff.id==='easy'?'#16a34a':diff.id==='medium'?'#92400e':diff.id==='hard'?'#dc2626':'#7c3aed'}">${diff.icon} ${diff.label}</div>
      </div>
      ${vocal
        ? `<button class="sound-btn" onclick="readQ()"><span style="font-size:1.3rem">🔊</span><span>${q.q}</span></button>${q.e?`<div class="qemoji">${q.e}</div>`:''}`
        : `${q.e?`<div class="qemoji">${q.e}</div>`:''}<div class="qtext">${q.q}</div>`}
      <div class="choices${vocal?' big':''}">${cho}</div>
      <div class="feedback" id="feedback"></div>
      <div class="navrow">
        <button class="btn" onclick="S.view='settings';render()">⚙️</button>
        <button class="btn primary" id="next-btn" style="display:none;background:${hex}" onclick="nextQ()">Suivant →</button>
      </div>
    </div>`;
}

function rResult(m) {
  const sub = LEVELS[S.level].subjects[S.subject];
  const total = S.questions.length;
  const ok = S.scoreOk;
  const pct = total>0 ? Math.round(ok/total*100) : 0;
  const emoji = pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  const msg = pct>=80?'Excellent, bravo !':pct>=60?'Bien joué, continue !':pct>=40?'Pas mal, entraîne-toi !':'Courage, tu vas progresser !';
  const hex = LV_COLORS[S.level];
  if (isVocal()) speak(msg);
  m.innerHTML = bc([{l:'Accueil',f:'home()'},{l:'Résultat',f:null}])+
    `<div class="rcard">
      <div class="remoji">${emoji}</div>
      <div class="rscore" style="color:${hex}">${ok} / ${total}</div>
      <div class="rpct">${pct}% · ${sub.label} · ${DIFFS.find(d=>d.id===S.difficulty).label}</div>
      <div class="rmsg">${msg}</div>
      <div class="rbtns">
        <button class="btn primary" style="background:${hex}" onclick="startQuiz()">🔄 Nouvelles questions</button>
        <button class="btn" onclick="S.view='settings';render()">⚙️ Paramètres</button>
        <button class="btn" onclick="home()">🏠 Accueil</button>
      </div>
    </div>`;
}

function bc(items) {
  return '<div class="bc">'+items.map((it,i)=>{
    if (i === items.length-1) return `<span class="bc-c">${it.l}</span>`;
    return `<span class="bc-i" onclick="${it.f}">${it.l}</span><span class="bc-s">›</span>`;
  }).join('')+'</div>';
}

// ════════════════════════════════════════════════════════
//  ACTIONS
// ════════════════════════════════════════════════════════
function home(){S.view='home';render()}
function goLevel(lv){S.level=lv;S.scoreOk=0;S.scoreKo=0;S.view='subject';render()}
function goSubject(sub){
  S.subject=sub;
  S.cat=Object.keys(LEVELS[S.level].subjects[sub].cats)[0];
  S.view='settings';
  render();
}
function setCat(c){S.cat=c;render()}
function setDiff(d){S.difficulty=d;render()}

function startQuiz(){
  S.scoreOk=0;S.scoreKo=0;
  S.questions=getQuestions(8);
  S.qIndex=0;S.answered=false;
  S.view='quiz';
  render();
  if (isVocal()) setTimeout(readQ,400);
}

function readQ(){
  const q = S.questions[S.qIndex];
  if (!q) return;
  const t = q.q+'. '+q.ch.map((c,i)=>['A','B','C','D'][i]+': '+c).join('. ');
  speak(t);
}

function answerV(idx){
  speak(S.questions[S.qIndex].ch[idx]);
  setTimeout(()=>answer(idx),700);
}

function answer(idx){
  if (S.answered) return;
  S.answered = true;
  const q = S.questions[S.qIndex];
  const correct = q.a;
  document.querySelectorAll('.cbtn').forEach((btn,i)=>{
    btn.disabled = true;
    if (i === correct && i !== idx) btn.classList.add('reveal');
  });
  const fb = document.getElementById('feedback');
  if (idx === correct) {
    document.getElementById('ch'+idx).classList.add('correct');
    fb.className = 'feedback ok';
    fb.innerHTML = '✓ Bravo !'+(q.ex?' — '+q.ex:'');
    S.scoreOk++;
    if (isVocal()) setTimeout(()=>speak('Bravo ! Bonne réponse !'),300);
  } else {
    document.getElementById('ch'+idx).classList.add('wrong');
    fb.className = 'feedback ko';
    fb.innerHTML = '✗ La bonne réponse : <strong>'+q.ch[correct]+'</strong>'+(q.ex?'<br>'+q.ex:'');
    S.scoreKo++;
    if (isVocal()) setTimeout(()=>speak('La bonne réponse était : '+q.ch[correct]),300);
  }
  document.getElementById('score-ok').textContent = S.scoreOk;
  document.getElementById('score-ko').textContent = S.scoreKo;
  document.getElementById('next-btn').style.display = '';
}

function nextQ(){
  S.qIndex++;
  S.answered = false;
  if (S.qIndex >= S.questions.length) {
    S.view = 'result';
    render();
    return;
  }
  render();
  if (isVocal()) setTimeout(readQ, 400);
}

render();
