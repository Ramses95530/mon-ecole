<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>École — GS · CP · CM1 · CM2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f1ee;--surface:#fff;--surface2:#faf8f5;--border:#e6e0d8;
  --text:#2a2320;--text2:#7a6f6a;--text3:#a89f9a;
  --gs:#e91e8c;--gs-l:#fde8f4;--gs-d:#b5166c;
  --cp:#ff9800;--cp-l:#fff3e0;--cp-d:#c77800;
  --cm1:#e07b39;--cm1-l:#fdf0e6;--cm1-d:#b85e20;
  --cm2:#3a8fcd;--cm2-l:#e6f3fc;--cm2-d:#1e6fa8;
  --ma:#9b59b6;--ma-l:#f5eefa;--ma-d:#7d3c98;
  --fr:#e74c3c;--fr-l:#fdecea;--fr-d:#c0392b;
  --ev:#27ae60;--ev-l:#eafaf1;--ev-d:#1e8449;
  --hi:#c0392b;--hi-l:#fdecea;--hi-d:#922b21;
  --ge:#27ae60;--ge-l:#eafaf1;--ge-d:#1e8449;
  --frcm:#9b59b6;--frcm-l:#f5eefa;--frcm-d:#7d3c98;
  --green:#2eaa6e;--green-l:#e6f7f0;
  --red:#e04848;--red-l:#fdeaea;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(0,0,0,.07);--shadow-lg:0 8px 32px rgba(0,0,0,.12)
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:2px solid var(--border);padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.logo{font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800}
.logo .gs{color:var(--gs)}.logo .cp{color:var(--cp)}.logo .cm1{color:var(--cm1)}.logo .cm2{color:var(--cm2)}
.logo .sep{color:var(--text3);font-size:.8rem;margin:0 3px}
.score-bar{display:flex;gap:7px}
.score-pill{display:flex;align-items:center;gap:4px;padding:4px 11px;border-radius:50px;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:var(--surface2)}
.score-pill.ok{border-color:var(--green);color:var(--green);background:var(--green-l)}
.score-pill.ko{border-color:var(--red);color:var(--red);background:var(--red-l)}
.main{max-width:680px;margin:0 auto;padding:1.5rem 1.25rem}
/* HOME */
.home-title{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:.3rem}
.home-sub{color:var(--text2);font-size:.95rem;text-align:center;margin-bottom:1.5rem}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.level-card{border:2px solid var(--border);border-radius:var(--radius);padding:1.25rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center}
.level-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.level-card.gs{border-color:var(--gs);background:var(--gs-l)}
.level-card.cp{border-color:var(--cp);background:var(--cp-l)}
.level-card.cm1{border-color:var(--cm1);background:var(--cm1-l)}
.level-card.cm2{border-color:var(--cm2);background:var(--cm2-l)}
.level-lbl{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800}
.level-card.gs .level-lbl{color:var(--gs)}.level-card.cp .level-lbl{color:var(--cp)}
.level-card.cm1 .level-lbl{color:var(--cm1)}.level-card.cm2 .level-lbl{color:var(--cm2)}
.level-desc{font-size:11px;color:var(--text2);margin-top:3px}
/* SUBJECT */
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.subject-card{border:2px solid var(--border);border-radius:var(--radius);padding:1.25rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center}
.subject-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.s-icon{font-size:2rem;margin-bottom:5px}
.s-lbl{font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:800}
.subject-card.ma{border-color:var(--ma)}.subject-card.ma .s-lbl{color:var(--ma)}
.subject-card.fr{border-color:var(--fr)}.subject-card.fr .s-lbl{color:var(--fr)}
.subject-card.ev{border-color:var(--ev)}.subject-card.ev .s-lbl{color:var(--ev)}
.subject-card.hi{border-color:var(--hi)}.subject-card.hi .s-lbl{color:var(--hi)}
.subject-card.ge{border-color:var(--ge)}.subject-card.ge .s-lbl{color:var(--ge)}
.subject-card.frcm{border-color:var(--frcm)}.subject-card.frcm .s-lbl{color:var(--frcm)}
.s-desc{font-size:11px;color:var(--text2);margin-top:2px}
/* PILLS */
.cat-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.25rem}
.cat-pill{padding:6px 13px;border-radius:50px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .18s}
/* QUESTION */
.q-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);animation:slideIn .22s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.q-num{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.progress-wrap{flex:1;height:5px;background:var(--bg);border-radius:5px;margin:0 12px;overflow:hidden}
.progress-fill{height:100%;border-radius:5px;transition:width .4s}
.q-badge{font-size:11px;font-weight:700;color:var(--text3)}
.q-text{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:1.25rem;line-height:1.5}
.q-emoji{font-size:3rem;text-align:center;margin-bottom:.75rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1rem}
.choice-btn{padding:13px 10px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .18s;text-align:center;line-height:1.3}
.choice-btn:hover:not(:disabled){border-color:var(--text3);background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{background:var(--green-l);border-color:var(--green);color:var(--green)}
.choice-btn.wrong{background:var(--red-l);border-color:var(--red);color:var(--red);text-decoration:line-through}
.choice-btn.reveal{background:var(--green-l);border-color:var(--green);color:var(--green);opacity:.65}
/* GS big buttons */
.choices.big .choice-btn{padding:18px 10px;font-size:1.1rem}
.feedback{border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:1rem;display:none}
.feedback.ok{display:block;background:var(--green-l);color:var(--green);border:1px solid var(--green)}
.feedback.ko{display:block;background:var(--red-l);color:var(--red);border:1px solid var(--red)}
.nav-row{display:flex;gap:10px;align-items:center}
.btn{padding:9px 20px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;border-radius:50px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .18s}
.btn:hover{border-color:var(--text3);color:var(--text)}
.btn.p-ma{background:var(--ma);border-color:var(--ma);color:#fff}.btn.p-ma:hover{background:var(--ma-d)}
.btn.p-fr,.btn.p-hi{background:var(--fr);border-color:var(--fr);color:#fff}.btn.p-fr:hover,.btn.p-hi:hover{background:var(--fr-d)}
.btn.p-ev,.btn.p-ge{background:var(--ev);border-color:var(--ev);color:#fff}.btn.p-ev:hover,.btn.p-ge:hover{background:var(--ev-d)}
.btn.p-frcm{background:var(--frcm);border-color:var(--frcm);color:#fff}.btn.p-frcm:hover{background:var(--frcm-d)}
/* RESULT */
.result-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;box-shadow:var(--shadow-lg);animation:slideIn .3s ease}
.result-emoji{font-size:3.5rem;margin-bottom:.75rem}
.result-score{font-family:'Baloo 2',cursive;font-size:2.8rem;font-weight:800}
.result-pct{font-size:14px;color:var(--text3);margin:4px 0 8px;font-weight:700}
.result-msg{font-size:1rem;font-weight:700;color:var(--text2);margin-bottom:1.75rem}
.result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* nav breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.bc-item{font-size:13px;font-weight:700;color:var(--text3);cursor:pointer}
.bc-item:hover{color:var(--text)}
.bc-sep{font-size:13px;color:var(--text3)}
.bc-current{font-size:13px;font-weight:700;color:var(--text)}
@media(max-width:500px){.choices,.level-grid{grid-template-columns:1fr}.subject-grid{grid-template-columns:1fr 1fr}.main{padding:1rem}.q-text{font-size:1.05rem}.logo{font-size:1rem}}
</style>
</head>

let S={view:"home",level:null,subject:null,cat:null,questions:[],qIndex:0,answered:false,scoreOk:0,scoreKo:0};
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function render(){
  document.getElementById("score-ok").textContent=S.scoreOk;
  document.getElementById("score-ko").textContent=S.scoreKo;
  const m=document.getElementById("main");
  if(S.view==="home"){renderHome(m);return}
  if(S.view==="subject"){renderSubject(m);return}
  if(S.view==="result"){renderResult(m);return}
  renderQuiz(m);
}

function renderHome(m){
  m.innerHTML=`
    <div class="home-title">Mon École</div>
    <div class="home-sub">Choisis ton niveau</div>
    <div class="level-grid">
      ${Object.entries(LEVELS).map(([k,v])=>`
        <div class="level-card ${k}" onclick="goLevel('${k}')">
          <div class="level-lbl">${v.label}</div>
          <div class="level-desc">${Object.keys(v.subjects).length} matières</div>
        </div>`).join("")}
    </div>`;
}

function renderSubject(m){
  const lv=LEVELS[S.level];
  m.innerHTML=`
    <div class="breadcrumb">
      <span class="bc-item" onclick="home()">Accueil</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">${lv.label}</span>
    </div>
    <div class="home-sub">Quelle matière ?</div>
    <div class="subject-grid">
      ${Object.entries(lv.subjects).map(([k,v])=>`
        <div class="subject-card ${k}" onclick="goSubject('${k}')">
          <div class="s-icon">${v.icon}</div>
          <div class="s-lbl">${v.label}</div>
          <div class="s-desc">${Object.keys(v.cats).length} thèmes</div>
        </div>`).join("")}
    </div>`;
}

function catPillsHtml(){
  const cats=LEVELS[S.level].subjects[S.subject].cats;
  return Object.entries(cats).map(([k,v])=>`<button class="cat-pill" id="pill-${k}" style="${S.cat===k?`background:var(--${S.subject}-l);border-color:var(--${S.subject});color:var(--${S.subject}-d)`:''}" onclick="goCat('${k}')">${v}</button>`).join("");
}

function renderQuiz(m){
  const lv=LEVELS[S.level]; const sub=lv.subjects[S.subject];
  const qs=S.questions; const q=qs[S.qIndex];
  const pct=Math.round(S.qIndex/qs.length*100);
  const isGS=S.level==="gs";
  m.innerHTML=`
    <div class="breadcrumb">
      <span class="bc-item" onclick="home()">Accueil</span>
      <span class="bc-sep">›</span>
      <span class="bc-item" onclick="goLevel('${S.level}')">${lv.label}</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">${sub.label}</span>
    </div>
    <div class="cat-row">${catPillsHtml()}</div>
    <div class="q-card">
      <div class="q-meta">
        <div class="q-num">Q ${S.qIndex+1}/${qs.length}</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%;background:var(--${S.subject})"></div></div>
        <div class="q-badge">${sub.cats[S.cat]}</div>
      </div>
      ${q.e?`<div class="q-emoji">${q.e}</div>`:""}
      <div class="q-text">${q.q}</div>
      <div class="choices${isGS?" big":""}">
        ${q.ch.map((c,i)=>`<button class="choice-btn" id="ch${i}" onclick="answer(${i})">${c}</button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <button class="btn" onclick="goLevel('${S.level}')">← Matières</button>
        <button class="btn p-${S.subject}" id="next-btn" style="display:none" onclick="nextQ()">Suivant →</button>
      </div>
    </div>`;
}

  const msg=pct>=80?"Excellent, bravo !":pct>=60?"Bien joué, continue !":pct>=40?"Pas mal, entraîne-toi encore !":"Courage, tu vas progresser !";
  m.innerHTML=`
    <div class="breadcrumb">
      <span class="bc-item" onclick="home()">Accueil</span>
      <span class="bc-sep">›</span>
      <span class="bc-item" onclick="goLevel('${S.level}')">${LEVELS[S.level].label}</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">${sub.label}</span>
    </div>
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score" style="color:var(--${S.subject})">${ok} / ${total}</div>
      <div class="result-pct">${pct}% · ${sub.cats[S.cat]}</div>
      <div class="result-msg">${msg}</div>
      <div class="result-btns">
        <button class="btn p-${S.subject}" onclick="restartSame()">Recommencer</button>
        <button class="btn" onclick="goLevel('${S.level}')">Changer de matière</button>
        <button class="btn" onclick="home()">Accueil</button>
      </div>
    </div>`;
}

// ============================================================
//  ACTIONS
// ============================================================
function home(){S.view="home";render()}
function goLevel(lv){S.level=lv;S.view="subject";render()}
function goSubject(sub){S.subject=sub;const firstCat=Object.keys(LEVELS[S.level].subjects[sub].cats)[0];goCat(firstCat)}
function goCat(cat){
  S.cat=cat;S.scoreOk=0;S.scoreKo=0;
  S.questions=shuffle(DATA[S.level][S.subject][cat]).slice(0,6);
  S.qIndex=0;S.answered=false;S.view="quiz";render();
}
function answer(idx){
  if(S.answered)return; S.answered=true;
  const q=S.questions[S.qIndex]; const correct=q.a;
  document.querySelectorAll(".choice-btn").forEach((btn,i)=>{btn.disabled=true;if(i===correct&&i!==idx)btn.classList.add("reveal")});
  const fb=document.getElementById("feedback");
  if(idx===correct){document.getElementById("ch"+idx).classList.add("correct");fb.className="feedback ok";fb.textContent="✓ Bravo, bonne réponse !";S.scoreOk++;}
  else{document.getElementById("ch"+idx).classList.add("wrong");fb.className="feedback ko";fb.textContent="✗ La bonne réponse était : "+q.ch[correct];S.scoreKo++;}
  document.getElementById("score-ok").textContent=S.scoreOk;
  document.getElementById("score-ko").textContent=S.scoreKo;
  document.getElementById("next-btn").style.display="";
}
function nextQ(){S.qIndex++;S.answered=false;if(S.qIndex>=S.questions.length)S.view="result";render()}
function restartSame(){S.scoreOk=0;S.scoreKo=0;S.questions=shuffle(DATA[S.level][S.subject][S.cat]).slice(0,6);S.qIndex=0;S.answered=false;S.view="quiz";render()}
render();
</script>
</body>
</html>
